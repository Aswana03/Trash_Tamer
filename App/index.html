<!DOCTYPE html>
<html>
<head>
  <title>Smart Waste App</title>

  <link rel="stylesheet" href="style.css">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google Maps -->
      <script async defer 
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDcf39RZ7YxVFR8FEpRVfA6zRqySn3EVdc&callback=getLocation">
</script>


<body>

<!-- LOGIN -->
 <div id="loginPage" class="card center">

  <h2>🌿 EcoFlow AI</h2>

  <div class="input-group">
    <label>📧 Email</label>
    <input type="email" id="loginEmail" placeholder="Enter your email">
  </div>

  <div class="input-group">
    <label>🔒 Password</label>
    <input type="password" id="loginPassword" placeholder="Enter your password">
  </div>

  <button onclick="login()">🚀 Login</button>

  <p onclick="showSignup()">✨ Create Account</p>

</div>

<!-- SIGNUP -->
<div id="signupPage" class="card center hidden">
  <h2>Sign Up</h2>
  <input id="signupEmail" placeholder="Email">
  <input id="signupPassword" type="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <p onclick="showLogin()">Back</p>
</div>

<!-- APP -->
<div id="homePage" class="hidden app">

  <div class="header">SMART WASTE SEGREGATION</div>

  <!-- HOME -->
   
   <!-- HOME -->
<div id="homeScreen" class="screen active">
  <div class="main-card">

    <div class="status">
      <span>🟢 LIVE</span>
      <button onclick="logout()">Exit</button>
    </div>

    <!-- BINS -->
    <div class="bins">

      <div class="bin">
        <div class="bin-box">
           <div id="bioFill" class="fill green">
  <div class="wave"></div>
</div>
        </div>
        <h3>BIO</h3>
        <h2 id="bioValue">0%</h2>
      </div>

      <div class="bin">
        <div class="bin-box">
           <div id="nonBioFill" class="fill red">
  <div class="wave"></div>
</div>
        </div>
        <h3>NON BIO</h3>
        <h2 id="nonBioValue">0%</h2>
      </div>

    </div>

    <!-- 🔄 SYNC BUTTON AT BOTTOM -->
    <div class="sync-container">
      <button class="sync-btn-small" onclick="syncData()">🔄 Sync</button>
    </div>

  </div>
</div>

  <!-- MAP -->
  <div id="mapScreen" class="screen">
    <div class="main-card">
      <div id="map"></div>
    </div>
  </div>

  <!-- ANALYTICS -->
   <div id="analyticsScreen" class="screen">
  <div class="main-card">
    <canvas id="chart"></canvas>

    <div id="insightBox">
      <p id="insightText">📊 Waiting for data...</p>
    </div>
  </div>
</div>
   

  <!-- NAV -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="showScreen('homeScreen', this)">
      <span class="material-icons">home</span><small>Home</small>
    </div>
    <div class="nav-item" onclick="showScreen('mapScreen', this)">
      <span class="material-icons">map</span><small>Map</small>
    </div>
    <div class="nav-item" onclick="showScreen('analyticsScreen', this)">
      <span class="material-icons">analytics</span><small>Analytics</small>
    </div>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
